; 运行入口参数（在 config.ini 中设置后，main.py 可无参运行）
; CLI 参数优先级高于此配置
[main]
; 原始媒体库目录（原 -s 参数）
source =
; 工作区目录（原 -w 参数），程序会在此创建 dist 和 tmp
workspace =
; Cloudflare Pages 项目名称（原 -p 参数）
project_name =

[media]
; Cloudflare Pages 单文件大小限制 (字节)
max_file_size = 25165824

; 图片压缩参数
[image]
; 初始画质 (0-100)
quality_start = 95
; 最低画质
quality_min = 20
; 画质递减步长
quality_step = 5
; 初始分辨率缩放比例
scale_start = 0.9
; 最低缩放比例
scale_min = 0.3
; 缩放递减步长
scale_step = 0.1

; 音频压缩参数
[audio]
; 音频处理模式: copy=直接复制不重新编码, encode=压缩编码
mode = copy
; 安全目标大小 (字节)，略小于 max_file_size 留余量
safe_target_bytes = 24641536
; 最大码率 (kbps)
bitrate_max = 320
; 最低码率 (kbps)
bitrate_min = 32
; 超标后码率衰减系数
bitrate_reduction_factor = 0.8

; 视频 HLS 复制模式 (不重新编码，直接切片，保留原始画质)
; 将此处的 video_mode 改为 copy 以启用，改为 encode 则使用硬件/软件编码
[video]
mode = copy
; HLS 切片容器：mpegts = 传统 .ts（默认，兼容性最好）
;                fmp4    = fMP4/CMAF，.m4s + init.mp4，支持 HEVC/AV1 与 master.m3u8 CODECS
hls_segment_type = mpegts
; 切片大小优先模式（true/false）
; 开启后将会优先切足指定大小的切片，而不是固定 hls_time 时长
; 复制模式下自动探测源文件码率来计算切片时长，编码模式下使用已配置的码率
size_priority_mode = false
; 切片大小优先模式下的目标切片大小（字节）
; 默认等于 [audio].safe_target_bytes（约 23.5MB），如需调整可在此设置
; size_priority_target = 24641536
; 当 mode=copy 时使用的音频编码参数
audio_copy_codec = copy
audio_copy_bitrate = 128k

; ── fMP4 相关（hls_segment_type = fmp4 时生效）──────────────────
; 媒体切片文件名模板；init.mp4 单独生成
fmp4_segment_pattern = segment_%05d.m4s
; 初始化片段文件名
fmp4_init_filename = init.mp4
; 是否生成带 CODECS 的 master.m3u8（推荐 true）
write_master_playlist = true
; 高码率 HEVC 是否使用 moof/mdat 边界重新分配切片以避免单文件超限
hevc_repartition = true
; 重新分配 HEVC 时的上游 fragment 尺寸（字节），应明显小于 max_segment_bytes
hevc_fragment_bytes = 18874368
; 单个 HLS 切片允许的最大字节数；默认沿用 [media].max_file_size
; max_segment_bytes = 25165824
; 切片超限时是否直接失败（false = 仅警告）
fail_on_oversize = false

; ── 静态 Range 流（用于原样发布 MKV 等容器）──────────────────────
; 开启后，匹配后缀的视频不再 HLS 切片，而是按固定大小拆分原始字节，
; 由 Pages Function 以单个 Range URL 提供；内挂 ASS/章节/音轨全部保留。
static_range_mode = false
; 参与静态 Range 流的容器后缀（逗号分隔）
static_range_extensions = .mkv
; 静态分块大小（字节），不得超过 [media].max_file_size
static_range_part_bytes = 25165824
; 分块与 manifest 的公开前缀
static_range_url_prefix = /stream

[video.copy]
; 复制模式下 ffmpeg 直接切片，保留原始视频编码和音频
; 无额外参数需要调整，默认按 3秒/HLS标准 切片

; 视频 HLS 硬件编码参数
[video.hw]
hwaccel = cuda
hwaccel_output_format = cuda
filter = scale_cuda=format=nv12
codec = h264_nvenc
preset = p6
profile = high
level = 5.2
rc = vbr
bitrate = 18M
maxrate = 24M
bufsize = 36M
gop_size = 144
keyint_min = 144
sc_threshold = 0
audio_codec = aac
audio_bitrate = 320k
hls_time = 6
hls_playlist_type = vod

; 视频 HLS 软件编码参数 (硬件失败时的回退)
[video.sw]
codec = libx264
preset = medium
crf = 20
filter = scale=format=yuv420p
gop_size = 144
keyint_min = 144
sc_threshold = 0
audio_codec = aac
audio_bitrate = 320k
hls_time = 6
hls_playlist_type = vod

; 小视频 MP4 硬件编码参数
[video.mp4.hw]
hwaccel = cuda
hwaccel_output_format = cuda
filter = scale_cuda=format=nv12
codec = h264_nvenc
preset = p6
tune = hq
profile = high
cq = 22
audio_codec = aac
audio_bitrate = 320k
movflags = +faststart

; 小视频 MP4 软件编码参数
[video.mp4.sw]
codec = libx264
preset = slow
crf = 22
pix_fmt = yuv420p
audio_codec = aac
audio_bitrate = 320k
movflags = +faststart

; 字幕处理
[subtitle]
; 是否在输出目录保留 ASS 源字幕（供 libass/SubtitlesOctopus 主题使用）
; false = 只保留 WebVTT；true = 额外保留 .ass 侧车文件
keep_ass = false
; 过滤关键词 (逗号分隔，不区分大小写)
filter_keywords = jp, jpn, 日, romaji

; 字幕语言映射 (VTT srclang 属性)
[subtitle.lang]
sc = zh
chs = zh
zh = zh
tc = zh-Hant
cht = zh-Hant
hant = zh-Hant
default = und

; 工作区目录名
[workspace]
dist_dirname = dist
tmp_dirname = tmp

; 网页密码鉴权（仅前端保护，阻挡一般访问）
[auth]
; 是否启用密码鉴权（true/false）
enabled = false
; 访问密码（留空则不设密码）
password =
; 密码提示语
prompt = 请输入访问密码
; 错误提示语
error_tip = 密码错误

; 网页标题与图标
[site]
; 网页标题（可通过 main.py -t 参数覆盖，不设置则用此默认值）
title = 喵喵喵 - MediaPages
; 网站图标 - 可以是本地文件路径（相对于项目目录）或完整 URL
; 示例本地路径: ./static/custom-favicon.ico
; 示例远程 URL: https://example.com/favicon.ico
; 留空或注释掉则使用 static/favicon.png
favicon =
; 前端主题（对应 static/theme/{theme}/ 下的 index.html）
theme = default

[player]
; auto=主题提供容器时启用 ArtPlayer；native=始终使用原生播放器
engine = auto
; 是否自动播放被 index 标记为 isDefault 的条目
autoplay_default = true

; Cloudflare Pages 部署凭证与命令
[cloudflare]
; API 令牌（也可通过 CLOUDFLARE_API_TOKEN 环境变量设置，优先级：环境变量 > 此配置）
api_token =
; 账户 ID（也可通过 CLOUDFLARE_ACCOUNT_ID 环境变量设置）
account_id =
; Wrangler 项目创建命令
project_create_cmd = npx wrangler pages project create {project_name} --production-branch main
; Wrangler 部署命令
deploy_cmd = npx wrangler pages deploy {dist_dir} --project-name {project_name}
upload_threshold_mb = 512

; CORS 配置 (部署时生成 _headers 文件)
[cors]
allow_origin = *
allow_methods = GET, HEAD, OPTIONS